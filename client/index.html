<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#150C22" />
    <meta
      name="description"
      content="HeyFutureJasmine! — seal a letter to your future self or the one you love, and let the tides deliver it when the time is right."
    />
    <title>HeyFutureJasmine!</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (the app gets shared as a plain URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HeyFutureJasmine!" />
    <meta property="og:title" content="HeyFutureJasmine!" />
    <meta
      property="og:description"
      content="Letters sealed in a chest, delivered when the time is right."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent a white flash before React mounts -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #150c22;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("⚓ [PWA] ServiceWorker registered:", reg.scope))
            .catch((err) => console.warn("⚠️ [PWA] ServiceWorker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
